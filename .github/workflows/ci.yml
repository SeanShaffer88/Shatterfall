name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2   # D22 pin

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check design docs consistency
        run: python .github/scripts/check_docs.py

  godot-tests:
    name: godot-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect Godot project
        id: detect
        run: |
          if [ -f project.godot ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No project.godot yet (pre-Phase 1): skipping Godot tests."; fi
      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.detect.outputs.present == 'true'
        run: |
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o "$zip" "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${zip}"
          unzip -q "$zip"
          install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --headless --version
      - name: Import project (D38)
        if: steps.detect.outputs.present == 'true'
        run: godot --headless --path . --import
      - name: Run headless gate suite
        if: steps.detect.outputs.present == 'true'
        run: godot --headless --path . -s res://tests/test_core_systems.gd
